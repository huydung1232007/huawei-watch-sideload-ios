# The Xcode project is generated with XcodeGen: ./generate.sh (uses the team and bundle ID from Config/local.env)
name: HuaSideload
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ${HUASIDELOAD_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  HuaSideload:
    type: application
    platform: iOS
    dependencies:
      - target: MapShare
        embed: true
    sources:
      - path: HuaSideload
        excludes: ["Info.plist"]
      # Output of tools/build-watch-app.sh: the app lists these under "Watch apps"
      - path: WatchApps
        optional: true
        buildPhase: resources
        includes: ["*.bin"]
      # Watch face packages (.hwt): the app lists these under "Watch faces"
      - path: WatchFaces
        optional: true
        buildPhase: resources
        includes: ["*.hwt"]
    info:
      path: HuaSideload/Info.plist
      properties:
        CFBundleDisplayName: HuaSideload Lite Test
        CFBundleShortVersionString: "1.5.3"
        CFBundleVersion: "30"
        CFBundleURLTypes:
          - CFBundleURLName: huasideload.maps
            CFBundleURLSchemes: [huasideload]
        NSBluetoothAlwaysUsageDescription: Needed to connect to your Huawei watch over Bluetooth.
        # voip: the watch speaker rings the watch with a CallKit call (refused without it); audio: keeps it playing when locked
        NSLocationWhenInUseUsageDescription: Dùng vị trí để tìm tuyến đường và gửi chỉ dẫn tới đồng hồ trong chuyến đi bạn bắt đầu, kể cả khi khóa màn hình.
        UIBackgroundModes: [bluetooth-central, audio, voip, location]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${HUASIDELOAD_BUNDLE_ID}
        TARGETED_DEVICE_FAMILY: "1"
  MapShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes: ["Info.plist"]
      - path: HuaSideload/MapShareEnvelope.swift
      - path: HuaSideload/MapPlaceLink.swift
      - path: HuaSideload/GooglePlaceIdentity.swift
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: HuaSideload
        CFBundleShortVersionString: "1.5.3"
        CFBundleVersion: "30"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MapShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${HUASIDELOAD_BUNDLE_ID}.maps-share
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
