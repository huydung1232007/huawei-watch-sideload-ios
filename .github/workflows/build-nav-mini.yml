name: Build Nav Mini unsigned watch prototype
on:
  push:
    branches: [hichain-lite-test]
    paths:
      - 'watch-apps/nav-mini/**'
      - 'tools/test-nav-mini.cjs'
      - 'tools/prepare-nav-mini-sdk.py'
      - 'tools/build-watch-app.sh'
      - '.github/workflows/build-nav-mini.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  watch:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test watch protocol and lifecycle
        run: node tools/test-nav-mini.cjs
      - uses: actions/cache/restore@v4
        id: sdk-cache
        with:
          path: ${{ runner.temp }}/ohos9
          key: navmini-ohos9-arm64-42444ed280e6-v1
      - name: Download and verify official legacy SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 1 --connect-timeout 20 --max-time 900 https://repo.huaweicloud.com/openharmony/os/3.2-Release/L2-SDK-MAC-M1-PUBLIC.tar.gz -o "$RUNNER_TEMP/ohos9.tar.gz"
          python3 tools/prepare-nav-mini-sdk.py "$RUNNER_TEMP/ohos9.tar.gz" "$RUNNER_TEMP/ohos9"
      - uses: actions/cache/save@v4
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ohos9
          key: navmini-ohos9-arm64-42444ed280e6-v1
      - name: Install compiler dependencies
        run: |
          echo "OHOS_SDK=$RUNNER_TEMP/ohos9" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP/ohos9/js/build-tools/ace-loader"
          if [ -f package-lock.json ]; then npm ci --legacy-peer-deps --no-audit --no-fund; else npm install --legacy-peer-deps --no-audit --no-fund; fi
      - name: Preserve public signing tools for later local signing
        run: |
          mkdir -p nav-mini-tools
          cp "$OHOS_SDK/toolchains/lib/"*.jar nav-mini-tools/
          printf '%s\n' 'Unmodified public OpenHarmony SDK 3.2.11.9 signing tools. SDK archive SHA-256: 42444ed280e6dcead7b5c9aa0e20c8df80cae75b6d9e20bc4eb9ced8a617906d' > nav-mini-tools/SDK-SOURCE.txt
      - name: Compile and package unsigned Nav Mini
        env:
          HUASIDELOAD_SKIP_SIGN: '1'
          HUASIDELOAD_LEGACY_IMAGES: '1'
        run: |
          export NODE16="$(command -v node)"
          bash tools/build-watch-app.sh watch-apps/nav-mini debug
          mkdir -p nav-mini-output
          cp watch-apps/nav-mini/build/out/unsigned.bin nav-mini-output/NavMini-unsigned.bin
          shasum -a 256 nav-mini-output/NavMini-unsigned.bin > nav-mini-output/NavMini-unsigned.bin.sha256
          printf '%s\n' 'UNSIGNED BUILD. Not installable on a retail watch. Requires a valid Huawei-issued certificate and matching profile. Personal signing files must stay local. No signature bypass is included.' > nav-mini-output/READ-ME-FIRST.txt
          python3 - <<'PY'
          import importlib.util, json
          spec = importlib.util.spec_from_file_location('checker','tools/check-watch-bin.py')
          checker = importlib.util.module_from_spec(spec); spec.loader.exec_module(checker)
          bundle, errors, notes = checker.check('nav-mini-output/NavMini-unsigned.bin')
          assert bundle == 'com.huydung1232007.navmini'
          assert errors == ['not signed (hap-sign-tool sign-app -inForm bin)'],errors
          from pathlib import Path
          _, files, _ = checker.entries(Path('nav-mini-output/NavMini-unsigned.bin').read_bytes())
          config = json.loads(files['config.json'])
          assert config['app']['apiVersion'] == {'compatible': 3, 'target': 3}
          assert config['app']['version'] == {'code': 1000002, 'name': '1.0.2'}
          manifest = json.loads(files['/assets/js/default/manifest.json'])
          assert manifest['minPlatformVersion'] == 3
          print('Package structure valid; only the expected missing-signature check remains.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NavMini-unsigned-prototype
          path: |
            nav-mini-output/
            watch-apps/nav-mini/build/compile.log
            nav-mini-tools/
