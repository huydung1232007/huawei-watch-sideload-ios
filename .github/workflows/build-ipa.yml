# Builds an UNSIGNED HuaSideload.ipa on a GitHub macOS runner. Sign it on Windows with Sideloadly.
# No secrets, certificates or Apple ID are used or needed here.
name: Build unsigned IPA

on:
  push:
    branches: [hichain-lite-test]
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle ID (make it unique, e.g. com.yourname.huasideload)"
        required: true
        default: "com.example.huasideload.lite"

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 25
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run parsing tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log

      - name: Generate Xcode project
        env:
          HUASIDELOAD_BUNDLE_ID: ${{ inputs.bundle_id || 'com.example.huasideload.lite' }}
          HUASIDELOAD_TEAM_ID: ""
        run: ./generate.sh

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project HuaSideload.xcodeproj \
            -target HuaSideload \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          APP="build/Release-iphoneos/HuaSideload.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry HuaSideload-unsigned.ipa Payload
          shasum -a 256 HuaSideload-unsigned.ipa | tee HuaSideload-unsigned.ipa.sha256
          /usr/libexec/PlistBuddy -c Print "$APP/Info.plist" | tee info-plist.txt

      - uses: actions/upload-artifact@v4
        with:
          name: HuaSideload-unsigned-ipa
          path: |
            HuaSideload-unsigned.ipa
            HuaSideload-unsigned.ipa.sha256
            info-plist.txt

      - name: Render navigation and history UI in simulator
        timeout-minutes: 12
        run: |
          set -o pipefail
          xcodebuild -project HuaSideload.xcodeproj -target HuaSideload -configuration Debug -sdk iphonesimulator ARCHS=arm64 ONLY_ACTIVE_ARCH=YES SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG SYMROOT="$PWD/ui-build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > ui-build.log 2>&1
          SIM_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; keys=sorted(d,key=lambda k:("iOS-27-0" not in k,k)); candidates=[v for k in keys if "iOS" in k for v in d[k] if v["name"].startswith("iPhone")]; preferred=[v for v in candidates if v["name"]=="iPhone 17"]; print((preferred or candidates)[0]["udid"])')
          xcrun simctl boot "$SIM_ID" || true
          python3 -c 'import subprocess,sys; subprocess.run(["xcrun","simctl","bootstatus",sys.argv[1],"-b"],check=True,timeout=240)' "$SIM_ID"
          xcrun simctl ui "$SIM_ID" appearance light
          xcrun simctl install "$SIM_ID" ui-build/Debug-iphonesimulator/HuaSideload.app
          xcrun simctl privacy "$SIM_ID" grant location com.example.huasideload.lite
          xcrun simctl location "$SIM_ID" set 10.77645,106.70092
          xcrun simctl status_bar "$SIM_ID" override --time "9:41" --batteryState charged --batteryLevel 100
          SIMCTL_CHILD_HUASIDELOAD_UI_PREVIEW=map xcrun simctl launch "$SIM_ID" com.example.huasideload.lite -AppleLanguages '(vi)' -AppleLocale vi_VN
          sleep 12
          xcrun simctl io "$SIM_ID" screenshot navigation-ui.png
          xcrun simctl terminate "$SIM_ID" com.example.huasideload.lite
          SIMCTL_CHILD_HUASIDELOAD_UI_PREVIEW=history xcrun simctl launch "$SIM_ID" com.example.huasideload.lite -AppleLanguages '(vi)' -AppleLocale vi_VN
          sleep 3
          xcrun simctl io "$SIM_ID" screenshot history-ui.png
          xcrun simctl terminate "$SIM_ID" com.example.huasideload.lite
          SIMCTL_CHILD_HUASIDELOAD_UI_PREVIEW=favorites xcrun simctl launch "$SIM_ID" com.example.huasideload.lite -AppleLanguages '(vi)' -AppleLocale vi_VN
          sleep 3
          xcrun simctl io "$SIM_ID" screenshot favorites-ui.png
          xcrun simctl terminate "$SIM_ID" com.example.huasideload.lite
          SIMCTL_CHILD_HUASIDELOAD_UI_PREVIEW=favorite-editor xcrun simctl launch "$SIM_ID" com.example.huasideload.lite -AppleLanguages '(vi)' -AppleLocale vi_VN
          sleep 3
          xcrun simctl io "$SIM_ID" screenshot favorite-editor-ui.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-preview
          path: |
            navigation-ui.png
            history-ui.png
            favorites-ui.png
            favorite-editor-ui.png
            ui-build.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: |
            build.log
            test.log
